      #   env:
      #     ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      #     ZERNIO_ACCOUNTS: ${{ secrets.ZERNIO_ACCOUNTS }}
      #     ZERNIO_PINTEREST_BOARD_ID: ${{ secrets.ZERNIO_PINTEREST_BOARD_ID }}
      #   run: npm run social:publish -- --live
