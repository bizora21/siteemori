name: Gerar assets sociais

# Dispara quando um artigo novo/editado é commitado (ficheiros TSX do blog).
# Gera manifest + imagem do Pin + textos, e publica tudo como artefacto para
# download. (A publicação automática via Zernio entra na Fase 4, aqui mesmo.)
on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**/*.tsx'
  workflow_dispatch: {}

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar manifest + imagens + textos sociais
        run: npm run social

      - name: Publicar assets como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: social-assets
          path: social/
          if-no-files-found: error
          retention-days: 30

      # Dry-run de publicação: mostra no log o que SERIA publicado (não publica).
      # Serve de verificação em cada artigo novo, sem risco.
      - name: Dry-run de publicação (Zernio)
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_ACCOUNTS: ${{ secrets.ZERNIO_ACCOUNTS }}
          ZERNIO_PINTEREST_BOARD_ID: ${{ secrets.ZERNIO_PINTEREST_BOARD_ID }}
        run: npm run social:publish

      # --- PUBLICAÇÃO REAL -----------------------------------------------------
      # Descomentar quando quiseres auto-publicar em cada artigo novo.
      # Nota: o vídeo do TikTok é gerado LOCALMENTE (a música é gitignored), por
      # isso no CI só o Pin do Pinterest tem ficheiro disponível.
      #
